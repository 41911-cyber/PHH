<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" fill="none">
  <defs>
    <linearGradient id="p1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16161C" />
      <stop offset="50%" stop-color="#1F1F28" />
      <stop offset="100%" stop-color="#0F0F14" />
    </linearGradient>
    <linearGradient id="p1Gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D299" />
      <stop offset="100%" stop-color="#9C752B" />
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>
  
  <rect width="900" height="560" rx="16" fill="url(#p1Grad)" />
  <rect width="898" height="558" x="1" y="1" rx="15" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2" />
  
  <!-- UI Browser Chrome -->
  <rect x="24" y="24" width="852" height="42" rx="10" fill="#111116" />
  <circle cx="50" cy="45" r="5" fill="#EF4444" opacity="0.8"/>
  <circle cx="68" cy="45" r="5" fill="#F59E0B" opacity="0.8"/>
  <circle cx="86" cy="45" r="5" fill="#10B981" opacity="0.8"/>
  <rect x="120" y="34" width="360" height="22" rx="6" fill="#1B1B22" />
  <text x="140" y="49" font-family="'Space Grotesk', monospace" font-size="11" fill="#71717A">https://experience.pablohenrick.dev</text>

  <!-- Visual Mockup Canvas: 3D Geometric Scene Simulation -->
  <g transform="translate(450, 290)">
    <!-- Concentric wireframe orbital rings -->
    <ellipse cx="0" cy="0" rx="220" ry="80" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="6 4" transform="rotate(-20)" />
    <ellipse cx="0" cy="0" rx="260" ry="100" stroke="url(#p1Gold)" stroke-width="1.5" stroke-opacity="0.6" transform="rotate(15)" />
    
    <!-- Central Polyhedron Wireframe -->
    <polygon points="0,-100 86,-50 86,50 0,100 -86,50 -86,-50" stroke="#FFFFFF" stroke-width="1.8" stroke-opacity="0.7" fill="#1E202C" fill-opacity="0.4"/>
    <line x1="0" y1="-100" x2="0" y2="100" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.4" />
    <line x1="-86" y1="-50" x2="86" y2="50" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.4" />
    <line x1="-86" y1="50" x2="86" y2="-50" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.4" />
    
    <!-- Glowing Node Core -->
    <circle cx="0" cy="0" r="28" fill="url(#p1Gold)" opacity="0.8" />
    <circle cx="0" cy="0" r="45" stroke="url(#p1Gold)" stroke-width="1.5" stroke-opacity="0.5" />
  </g>

  <!-- Editorial Info Banner at bottom -->
  <rect x="40" y="460" width="820" height="64" rx="10" fill="#111116" fill-opacity="0.9" stroke="#FFFFFF" stroke-opacity="0.05" />
  <text x="64" y="498" font-family="'Cinzel', serif" font-weight="700" font-size="16" fill="#F4F4F5" letter-spacing="2">PROJETO 01 // EXPERIÊNCIA 3D IMERSIVA</text>
  <text x="836" y="498" font-family="'Space Grotesk', monospace" font-size="12" fill="#E5C384" text-anchor="end">WEBGL • THREE.JS • GSAP</text>
</svg>

