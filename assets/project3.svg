<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" fill="none">
  <defs>
    <linearGradient id="p3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141118" />
      <stop offset="50%" stop-color="#1E1724" />
      <stop offset="100%" stop-color="#0E0C12" />
    </linearGradient>
    <linearGradient id="p3Gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D299" />
      <stop offset="100%" stop-color="#9C752B" />
    </linearGradient>
    <linearGradient id="roseAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#BE185D" />
    </linearGradient>
  </defs>
  
  <rect width="900" height="560" rx="16" fill="url(#p3Grad)" />
  <rect width="898" height="558" x="1" y="1" rx="15" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2" />
  
  <!-- UI Browser Chrome -->
  <rect x="24" y="24" width="852" height="42" rx="10" fill="#111116" />
  <circle cx="50" cy="45" r="5" fill="#EF4444" opacity="0.8"/>
  <circle cx="68" cy="45" r="5" fill="#F59E0B" opacity="0.8"/>
  <circle cx="86" cy="45" r="5" fill="#10B981" opacity="0.8"/>
  <rect x="120" y="34" width="360" height="22" rx="6" fill="#1B1B22" />
  <text x="140" y="49" font-family="'Space Grotesk', monospace" font-size="11" fill="#71717A">https://editorial.pablohenrick.dev</text>

  <!-- Editorial Creative Platform Display -->
  <g transform="translate(100, 105)">
    <!-- Main Magazine/Editorial Frame -->
    <rect x="0" y="0" width="700" height="320" rx="12" fill="#18151D" stroke="#FFFFFF" stroke-opacity="0.06"/>
    
    <!-- Editorial Headline Simulation -->
    <text x="50" y="70" font-family="'Cinzel', serif" font-weight="700" font-size="34" fill="#F4F4F5" letter-spacing="4">CHRONICLES OF LIGHT</text>
    <text x="50" y="105" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#E5C384" letter-spacing="3">EDITORIAL DIRECTION &amp; EXPERIMENTAL INTERFACE</text>

    <!-- Split Visual Columns -->
    <rect x="50" y="130" width="280" height="150" rx="8" fill="#241E2C" />
    <circle cx="190" cy="205" r="45" fill="none" stroke="url(#p3Gold)" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="190" y="210" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">VISUAL ART</text>

    <rect x="350" y="130" width="300" height="150" rx="8" fill="#141117" stroke="#FFFFFF" stroke-opacity="0.04" />
    <line x1="375" y1="160" x2="625" y2="160" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="2"/>
    <line x1="375" y1="185" x2="580" y2="185" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1.5"/>
    <line x1="375" y1="210" x2="600" y2="210" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1.5"/>
    <line x1="375" y1="235" x2="480" y2="235" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1.5"/>
    <circle cx="615" cy="245" r="16" fill="url(#p3Gold)"/>
  </g>

  <!-- Editorial Info Banner at bottom -->
  <rect x="40" y="460" width="820" height="64" rx="10" fill="#111116" fill-opacity="0.9" stroke="#FFFFFF" stroke-opacity="0.05" />
  <text x="64" y="498" font-family="'Cinzel', serif" font-weight="700" font-size="16" fill="#F4F4F5" letter-spacing="2">PROJETO 03 // REVISTA DIGITAL &amp; EXPERIÊNCIA DE MARCA</text>
  <text x="836" y="498" font-family="'Space Grotesk', monospace" font-size="12" fill="#E5C384" text-anchor="end">EDITORIAL UI • GSAP SMOOTH SCROLL • TYPOGRAPHY</text>
</svg>

