<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140" fill="none">
  <defs>
    <linearGradient id="phGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E7CE" />
      <stop offset="25%" stop-color="#E5C384" />
      <stop offset="65%" stop-color="#C59B48" />
      <stop offset="100%" stop-color="#9C752B" />
    </linearGradient>
    <linearGradient id="phRing" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C59B48" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#F7E7CE" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#C59B48" stop-opacity="0.1" />
    </linearGradient>
    <filter id="phGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Geometric Outer Emblem Frame -->
  <rect x="8" y="8" width="124" height="124" rx="28" stroke="url(#phRing)" stroke-width="1.5" fill="none" opacity="0.6"/>
  <circle cx="70" cy="70" r="54" stroke="url(#phRing)" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>
  
  <!-- Subtle Corner Accents -->
  <path d="M 16 32 L 16 16 L 32 16" stroke="url(#phGold)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M 124 32 L 124 16 L 108 16" stroke="url(#phGold)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M 16 108 L 16 124 L 32 124" stroke="url(#phGold)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M 124 108 L 124 124 L 108 124" stroke="url(#phGold)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/>

  <!-- Interlocking Monogram P & H -->
  <!-- Stem 1: Left pillar of P -->
  <path d="M 40 36 L 50 36 L 50 104 L 40 104 Z" fill="url(#phGold)" filter="url(#phGlow)"/>
  
  <!-- Bowl of P: curves across to meet H -->
  <path d="M 50 36 L 76 36 C 88 36, 96 44, 96 55 C 96 66, 88 74, 76 74 L 50 74 Z M 50 46 L 74 46 C 80 46, 85 50, 85 55 C 85 60, 80 64, 74 64 L 50 64 Z" fill="url(#phGold)"/>
  
  <!-- Crossbar connecting P and Right Stem of H -->
  <path d="M 72 65 L 100 65 L 100 75 L 72 75 Z" fill="url(#phGold)"/>

  <!-- Stem 2: Right pillar of H -->
  <path d="M 90 44 L 100 44 L 100 104 L 90 104 Z" fill="url(#phGold)"/>

  <!-- Architectural Serifs & Precision Dots -->
  <circle cx="70" cy="18" r="2" fill="url(#phGold)" opacity="0.9"/>
  <circle cx="70" cy="122" r="2" fill="url(#phGold)" opacity="0.9"/>
</svg>

