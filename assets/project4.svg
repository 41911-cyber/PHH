<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" fill="none">
  <defs>
    <linearGradient id="p4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121816" />
      <stop offset="50%" stop-color="#182420" />
      <stop offset="100%" stop-color="#0E1412" />
    </linearGradient>
    <linearGradient id="emeraldGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#F2D299" />
      <stop offset="100%" stop-color="#9C752B" />
    </linearGradient>
  </defs>
  
  <rect width="900" height="560" rx="16" fill="url(#p4Grad)" />
  <rect width="898" height="558" x="1" y="1" rx="15" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2" />
  
  <!-- UI Browser Chrome -->
  <rect x="24" y="24" width="852" height="42" rx="10" fill="#111116" />
  <circle cx="50" cy="45" r="5" fill="#EF4444" opacity="0.8"/>
  <circle cx="68" cy="45" r="5" fill="#F59E0B" opacity="0.8"/>
  <circle cx="86" cy="45" r="5" fill="#10B981" opacity="0.8"/>
  <rect x="120" y="34" width="360" height="22" rx="6" fill="#1B1B22" />
  <text x="140" y="49" font-family="'Space Grotesk', monospace" font-size="11" fill="#71717A">https://fintech.pablohenrick.dev</text>

  <!-- Visual Mockup Canvas: Luxury FinTech / Crypto Analytical Dashboard -->
  <g transform="translate(80, 105)">
    <!-- Main Dashboard Card -->
    <rect x="0" y="0" width="740" height="320" rx="12" fill="#141C18" stroke="#FFFFFF" stroke-opacity="0.06"/>
    
    <!-- KPI blocks -->
    <rect x="30" y="30" width="200" height="80" rx="8" fill="#1A2520" />
    <text x="50" y="55" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#34D399">PORTFOLIO INDEX</text>
    <text x="50" y="90" font-family="'Cinzel', serif" font-size="24" font-weight="700" fill="#FFFFFF">$ 4,892,100</text>

    <rect x="250" y="30" width="200" height="80" rx="8" fill="#1A2520" />
    <text x="270" y="55" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#F2D299">PERFORMANCE</text>
    <text x="270" y="90" font-family="'Cinzel', serif" font-size="24" font-weight="700" fill="#FFFFFF">+ 34.8% YTD</text>

    <rect x="470" y="30" width="240" height="80" rx="8" fill="#1A2520" />
    <text x="490" y="55" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#9CA3AF">ALGORITHM STATUS</text>
    <text x="490" y="90" font-family="'Space Grotesk', monospace" font-size="16" fill="#34D399">● OPTIMAL 99.98%</text>

    <!-- Candlestick / Area Chart Wave -->
    <path d="M 30 260 C 100 240, 150 280, 220 210 C 290 140, 360 210, 430 180 C 500 150, 570 230, 640 160 C 670 130, 690 140, 710 120" 
          fill="none" stroke="url(#emeraldGold)" stroke-width="3" stroke-linecap="round" />
    <!-- Gradient Fill below curve -->
    <path d="M 30 260 C 100 240, 150 280, 220 210 C 290 140, 360 210, 430 180 C 500 150, 570 230, 640 160 C 670 130, 690 140, 710 120 L 710 290 L 30 290 Z" 
          fill="url(#emeraldGold)" fill-opacity="0.1" />
  </g>

  <!-- Editorial Info Banner at bottom -->
  <rect x="40" y="460" width="820" height="64" rx="10" fill="#111116" fill-opacity="0.9" stroke="#FFFFFF" stroke-opacity="0.05" />
  <text x="64" y="498" font-family="'Cinzel', serif" font-weight="700" font-size="16" fill="#F4F4F5" letter-spacing="2">PROJETO 04 // PLATAFORMA ANALÍTICA FINTECH</text>
  <text x="836" y="498" font-family="'Space Grotesk', monospace" font-size="12" fill="#E5C384" text-anchor="end">DASHBOARD UI • DATA VIS • HIGH PERFORMANCE</text>
</svg>

